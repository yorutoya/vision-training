[package]
name = "aiming-sim"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

# Build independently of the main workspace's native vision dependencies.
[workspace]

[features]
default = ["viewer"]
viewer = ["dep:rxui", "dep:glam", "dep:bytemuck", "dep:image", "dep:pollster"]

[dependencies]
anyhow = "1"
mcap = { version = "0.26", default-features = false }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dependencies.pollster]
version = "1"
optional = true

[dependencies.rxui]
version = "0.1.0"
features = ["native"]
optional = true

[dependencies.glam]
version = "0.34"
optional = true

[dependencies.bytemuck]
version = "1"
features = ["derive"]
optional = true

[dependencies.image]
version = "0.25"
default-features = false
features = ["png"]
optional = true


[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
